services:
  app:
    build: .
    container_name: ewalas-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ewalas}
      DB_USERNAME: ${DB_USERNAME:-ewalas}
      DB_PASSWORD: ${DB_PASSWORD:-ewalas_secret}
    volumes:
      - app_storage:/var/www/storage

  db:
    image: mysql:8.0
    container_name: ewalas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-ewalas}
      MYSQL_USER: ${DB_USERNAME:-ewalas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ewalas_secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  db_data:
